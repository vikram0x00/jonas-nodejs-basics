<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Node Farm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <style>
        html, body{
            padding: 0;
            margin: 0;
            background-color: #4caf50;
        }
        *{
            color: white;
            font-family: 'Manrope';
        }
        .navbar{
            background-color: #d3d3d336;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .navbar a{
            text-decoration: none;
        }
        .main-product{
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background-color: #005000;
            padding: 1em;
            margin: auto;
            width: 70vw;
            border-radius: 20px;
            margin-top: 2em !important;
        }
        .container{
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .item{
            background-color: #005000;
            padding-inline: 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 70vw;
            height: 60px;
            margin-top: 10px;
        }
        .item .emoji{
            font-size: 30px;
        }
        .item .organic {
            color: greenyellow;
        }
        .organic{ 
            color: greenyellow;
        }
        .item a{
            text-decoration: none;
            background-color: #4caf50;
            padding: 5px;
            border-radius: 5px;
            border: none;
            outline: none;
        }
        .button{
            text-decoration: none;
            background-color: #4caf50;
            padding: 5px;
            border-radius: 5px;
            border: none;
            outline: none;
            font-size: 20px;
        }
        .emoji-lg{
            font-size: 5vw;
            line-height: 0;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/"><h3>🍃 The Node Farm 🌿</h3></a>
    </nav>
    <section class="main-product">
    <h1>{%PRODUCTNAME%}</h1>
    <p class="emoji-lg">
        {%IMAGE%}
    </p>
    <p>🌍 {%FROM%}</p>
    <p class="organic">🍃 {%ORGANIC%}</p>
    <p>❤️ {%NUTRIENTS%}</p>
    <p>📦 </p>
    <p>💲 {%PRICE%}</p>
    <p>{%DESCRIPTION%}</p>
    <button class="button">➕ ADD TO CART</button>
</section>
</body>
</html>
